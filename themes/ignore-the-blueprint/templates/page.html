{% extends "base.html" %}

{% block nav_about %}{% if page.slug == 'about-me' %} aria-current="page"{% endif %}{% endblock %}

{% block content %}
<article class="row page">
  <div class="row-main">
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
    </header>

    <div class="page-content">
      {{ page.content }}
    </div>
  </div>
</article>
{% endblock %}
