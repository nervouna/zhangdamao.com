{% extends "base.html" %}

{% block extra_head %}
  <meta name="robots" content="noindex,follow" />
{% endblock %}

{% block content %}
<article class="row page">
  <div class="row-main">
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
    </header>

    <div class="page-content">
      {{ page.content }}
    </div>
  </div>
</article>
{% endblock %}
